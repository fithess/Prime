<style>
  :root{
    --bg:#0A0A0A; --surface:#161616; --surface-alt:#212121; --line:#333333;
    --text:#F7F7F5; --muted:#8F8F8F; --gold:#D7FF3F; --gold-dim:#7A8F1F; --teal:#3DA9FC; --red:#FF3B30;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .display{font-family:'Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:900;letter-spacing:.01em;text-transform:uppercase;}
  .mono{font-family:'SF Mono','Consolas','Menlo','Courier New',monospace;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:20px 16px 100px;}
  button{font:inherit;border:none;background:none;color:inherit;cursor:pointer;}
  input{font:inherit;color:var(--text);background:var(--surface-alt);border:1px solid var(--line);
    border-radius:2px;padding:9px 11px;width:100%;}
  input::placeholder{color:var(--muted);opacity:.75;}
  input:focus{outline:2px solid var(--gold);outline-offset:-1px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.4);}
  .pill{font-size:11px;padding:3px 9px;border-radius:2px;font-weight:800;letter-spacing:.5px;display:inline-block;text-transform:uppercase;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .center{justify-content:center;}
  .gap6{gap:6px;} .gap8{gap:8px;} .gap10{gap:10px;} .gap14{gap:14px;}
  .col{display:flex;flex-direction:column;}
  .muted{color:var(--muted);font-size:13px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .btn-primary{background:var(--gold);color:#0A0A0A;font-weight:900;border-radius:2px;padding:14px;text-align:center;
    text-transform:uppercase;letter-spacing:.03em;box-shadow:0 3px 16px rgba(215,255,63,.2);}
  .btn-secondary{background:var(--surface-alt);color:var(--text);font-weight:800;border-radius:2px;padding:14px;text-align:center;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em;}
  .btn-outline{background:transparent;border:2px solid var(--gold);color:var(--gold);font-weight:900;border-radius:2px;padding:6px 10px;font-size:12px;text-transform:uppercase;}
  .bar-bg{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden;}
  .bar-fill{height:100%;transition:width .3s;}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;}
  .navbtn .ic{font-size:19px;}
  .navbtn .lb{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;}
  .fade{animation:fadeUp .25s ease;}
  h1.display, h2.display{letter-spacing:.01em;position:relative;padding-bottom:10px;}
  h1.display::after, h2.display::after{content:"";position:absolute;bottom:0;left:0;width:36px;height:4px;background:var(--gold);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideHoriz{0%,100%{transform:translateX(-26px);}50%{transform:translateX(26px);}}
  @keyframes slideVert{0%,100%{transform:translateY(28px);}50%{transform:translateY(-28px);}}
  @keyframes rotateSwing{0%,100%{transform:rotate(-22deg);}50%{transform:rotate(22deg);}}
  @keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(215,255,63,.45);}50%{box-shadow:0 0 0 12px rgba(215,255,63,0);}}
  .diagram{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .diagram-box{border:2px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .diagram-box.horiz{width:150px;height:64px;}
  .diagram-box.vert{width:64px;height:140px;}
  .diagram-figure{font-size:26px;}
  .slide-horiz{animation:slideHoriz 1.8s ease-in-out infinite;}
  .slide-vert{animation:slideVert 1.8s ease-in-out infinite;}
  .rotate-swing{animation:rotateSwing 1.8s ease-in-out infinite;transform-origin:center bottom;}
  .pulse-circle{width:66px;height:66px;border-radius:50%;border:3px solid var(--gold);display:flex;align-items:center;
    justify-content:center;font-size:28px;animation:pulseRing 1.8s ease-in-out infinite;}
  .diagram-label{font-size:11px;color:var(--muted);text-align:center;}
  .steps{display:flex;flex-direction:column;gap:10px;margin:8px 0 0;padding:0;list-style:none;}
  .steps li{display:flex;gap:10px;align-items:flex-start;}
  .stepnum{min-width:22px;height:22px;border-radius:6px;background:var(--surface-alt);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .badge-tile{background:var(--surface-alt);border-radius:10px;padding:12px 6px;text-align:center;}
  .dot{width:6px;height:6px;border-radius:999px;background:var(--line);}
  .dot.on{background:var(--gold);}
  .daygrid{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;}
  .daycell{aspect-ratio:1;border-radius:4px;background:var(--surface-alt);}
  .daycell.on{background:var(--gold);}
  a{color:inherit;}
</style>
</head>

function maxHR(){
  const age = toNum(STATE.profile.age);
  if (isNaN(age) || age<=0) return null;
  return 220 - age;
}
function cardioSessionCount(kind){
  return STATE.sessions.filter(s=>s.type==="cardio" && s.cardioKind===kind).length;
}
// Progression: tous les 4 séances, le programme monte un peu (durée/vitesse/tours),
// avec des paliers concrets à suivre directement sur le tapis.
function suggestedCardioTarget(day){
  const kind = day.cardioKind || "steady";
  const proto = CARDIO_PROTOCOLS[kind];
  const count = cardioSessionCount(kind);
  const level = Math.floor(count/4); // palier de progression

  if (kind==="hiit"){
    const rounds = Math.min(10, 6 + level);
    const sprintSpeed = Math.min(16, 12.5 + level*0.5);
    const sprintIncline = 2;
    const segments = [
      {label:"Échauffement", minutes:5, incline:1, speed:6.5},
      {label:`${rounds}x [30 sec sprint / 90 sec récup]`, minutes: rounds*2, incline:sprintIncline, speed:sprintSpeed, note:`Sprint à ${sprintSpeed}km/h (incline ${sprintIncline}%) 30 sec, puis marche/trot à 6.5km/h (incline 1%) 90 sec. Répète ${rounds} fois.`},
      {label:"Retour au calme", minutes:5, incline:0, speed:5.5},
    ];
    const totalMinutes = segments.reduce((a,s)=>a+s.minutes,0);
    return {kind, proto, rounds, totalMinutes, segments};
  }

  const totalMinutes = Math.min(45, 28 + level*5);
  const flatSpeed = Math.min(12, 9.5 + level*0.5);
  const climbSpeed = Math.min(9, 7.5 + level*0.3);
  const blockMinutes = Math.max(5, Math.round((totalMinutes-10)/2));
  const segments = [
    {label:"Échauffement", minutes:5, incline:1, speed:6},
    {label:"Bloc côte", minutes:blockMinutes, incline:6, speed:climbSpeed},
    {label:"Bloc rapide", minutes:blockMinutes, incline:0, speed:flatSpeed},
    {label:"Retour au calme", minutes:5, incline:0, speed:5.5},
  ];
  return {kind, proto, totalMinutes: segments.reduce((a,s)=>a+s.minutes,0), segments};
}

function normalizeText(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function allFoods(){ return [...FOOD_DB, ...STATE.customFoods]; }
function searchFood(query){
  const q = normalizeText(query).trim();
  if (!q) return [];
  const rawWords = q.split(/\s+/).filter(Boolean);
  const words = [];
  rawWords.forEach(w=>{ words.push(w); if (w.length>3 && w.endsWith("s")) words.push(w.slice(0,-1)); });
  const scored = allFoods().map(item=>{
    const hay = normalizeText(item.name+" "+(item.alias||[]).join(" "));
    let score = 0;
    words.forEach(w=>{ if (hay.includes(w)) score++; else if (w.length>4 && [...hay.split(/[\s,]+/)].some(h=>h.startsWith(w.slice(0,4)))) score+=0.5; });
    return {item, score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  return scored.slice(0,10).map(x=>x.item);
}
function frequentFoods(n){
  const entries = Object.entries(STATE.foodUsage).sort((a,b)=>b[1]-a[1]).slice(0,n);
  return entries.map(([id])=>allFoods().find(f=>f.id===id)).filter(Boolean);
}
function bumpFoodUsage(id){
  STATE.foodUsage[id] = (STATE.foodUsage[id]||0) + 1;
  save(LS.foodUsage, STATE.foodUsage);
}

// One-time migration: shift an already-saved schedule to the new Tuesday-start
// template (Monday becomes rest), keeping any exercises the user had swapped in.
(function migrateSchedule(){
  if (localStorage.getItem(SCHEDULE_MIGRATION_KEY)) return;
  const byId = {};
  STATE.program.days.forEach(d=>{ byId[d.id] = d; });
  const migrated = SCHEDULE_V2_ORDER.map(id=>{
    const day = byId[id];
    if (!day) return null;
    return {...day, weekday: SCHEDULE_V2_WEEKDAYS[id]};
  }).filter(Boolean);
  if (migrated.length === STATE.program.days.length){
    STATE.program = {...STATE.program, days: migrated};
    save(LS.program, STATE.program);
  }
  localStorage.setItem(SCHEDULE_MIGRATION_KEY, "1");
})();

function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const todayStr = () => localDateStr(new Date());
const fmtDate = d => new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short"});
const fmtWeekday = d => new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long"});
const addDays = (d,n) => { const x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return localDateStr(x); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toNum(v){ if (v===null||v===undefined||v==="") return NaN; return parseFloat(String(v).replace(",",".")); }

function slotForDate(dateStr){
  const overrideId = STATE.weekOverrides[dateStr];
  if (overrideId){
    const overridden = STATE.program.days.find(d => d.id === overrideId);
    if (overridden) return overridden;
  }
  const wd = fmtWeekday(dateStr).toLowerCase();
  return STATE.program.days.find(d => d.weekday.toLowerCase() === wd) || null;
}

function autoMoveForFive(d){
  const slot = slotForDate(d);
  if (!slot || slot.type!=="muscu") return;
  if (STATE.sessions.some(s=>s.date===d)) return;
  const isMuscu = x => { const sl = slotForDate(x); return !!sl && sl.type==="muscu" && !STATE.fiveDays[x]; };
  let best=null;
  for (let off=-3; off<=4; off++){
    if (off===0) continue;
    const t = addDays(d, off);
    if (t < todayStr()) continue;
    const sl = slotForDate(t);
    if (!sl || sl.type==="muscu" || STATE.fiveDays[t] || STATE.sessions.some(s=>s.date===t)) continue;
    const adj = [addDays(t,-1), addDays(t,1)].some(x => x!==d && isMuscu(x));
    const score = (adj?10:0) + (sl.type==="cardio"?4:0) + Math.abs(off) + (off<0?1.5:0);
    if (!best || score<best.score) best = {t, adj, score};
  }
  if (!best) return;
  swapDays(d, best.t);
  STATE.fiveMoves = {...STATE.fiveMoves, [d]: {to:best.t, adj:best.adj}};
  save(LS.fiveMoves, STATE.fiveMoves);
}
function undoFiveMove(d){
  const mv = STATE.fiveMoves[d];
  if (!mv) return;
  clearSwap(d); clearSwap(mv.to);
  const next = {...STATE.fiveMoves}; delete next[d];
  STATE.fiveMoves = next; save(LS.fiveMoves, STATE.fiveMoves);
}
// ---- Suivi des kcal mangées : statut du jour + 7 derniers jours + verdict
const INTAKE_META = {
  none:{color:"var(--line)", label:"—"},
  low:{color:"var(--gold)", label:"Trop bas"},
  ok:{color:"var(--teal)", label:"Sur la bonne voie"},
  slip:{color:"var(--gold)", label:"Petit écart"},
  over:{color:"var(--red)", label:"Gros écart"},
};
function intakeStatus(eaten, t){
  if (!eaten || !t) return "none";
  if (eaten < t.strict) return "low";
  if (eaten <= t.bien) return "ok";
  if (eaten <= t.craque) return "slip";
  return "over";
}
function intakeReport(){
  const days = [];
  for (let i=6;i>=0;i--){
    const date = addDays(todayStr(), -i);
    const eaten = dayKcalTotal(STATE.daily[date]||{});
    const t = tiersForDate(date);
    days.push({date, eaten, t, status: intakeStatus(eaten, t), isToday: i===0});
  }
  const done = days.filter(d=>!d.isToday && d.eaten>0 && d.t);
  if (done.length<2) return {days, verdict:{icon:"📊", color:"var(--muted)", text:"Note tes repas encore quelques jours (la montre aussi) et je te dis si t'es sur la bonne voie."}};
  const avgEaten = Math.round(done.reduce((a,d)=>a+d.eaten,0)/done.length);
  const avgDef = Math.round(done.reduce((a,d)=>a+(d.t.tdee-d.eaten),0)/done.length);
  const kgWeek = Math.max(0, avgDef*7/7700);
  const lowDays = done.filter(d=>d.status==="low").length;
  const overDays = done.filter(d=>d.status==="over"||d.status==="slip").length;
  const tail = overDays ? ` (${overDays} jour${overDays>1?"s":""} d'écart sur ${done.length})` : "";
  let verdict;
  if (lowDays >= Math.ceil(done.length/2)){
    verdict = {icon:"⚠️", color:"var(--gold)", text:`Tu manges souvent sous ton niveau Strict (${lowDays} jours sur ${done.length}, moyenne ${avgEaten} kcal). Descendre plus bas n'accélère presque pas la perte et ça mange ton muscle : remonte vers "Bien".`};
  } else if (avgDef >= 500){
    verdict = {icon:"✅", color:"var(--teal)", text:`Sur la bonne voie : déficit moyen ~${avgDef} kcal/j, soit environ -${kgWeek.toFixed(1)} kg par semaine à ce rythme${tail}.`};
  } else if (avgDef >= 200){
    verdict = {icon:"🟡", color:"var(--gold)", text:`Ça avance doucement : déficit moyen ~${avgDef} kcal/j (≈ -${kgWeek.toFixed(1)} kg/semaine)${tail}. Vise plus souvent "Bien".`};
  } else {
    verdict = {icon:"🔴", color:"var(--red)", text:`Pas assez de déficit : ~${avgDef} kcal/j de marge, le poids ne bougera presque pas${tail}.`};
  }
  return {days, verdict};
}
function swapDays(dateA, dateB){
  const dayA = slotForDate(dateA);
  const dayB = slotForDate(dateB);
  if (!dayA || !dayB) return;
  STATE.weekOverrides = {...STATE.weekOverrides, [dateA]: dayB.id, [dateB]: dayA.id};
  save(LS.weekOverrides, STATE.weekOverrides);
}
function clearSwap(dateStr){
  const next = {...STATE.weekOverrides};
  delete next[dateStr];
  STATE.weekOverrides = next;
  save(LS.weekOverrides, STATE.weekOverrides);
}

function weekIndexFor(dateStr){
  const epoch = new Date("2026-01-05T00:00:00"); // a Monday reference
  const d = new Date(dateStr+"T00:00:00");
  return Math.floor((d - epoch) / (7*86400000));
}
function weeklyExercises(baseIds, dateStr){
  const wk = weekIndexFor(dateStr);
  if (wk % 2 === 0) return baseIds;
  const used = new Set(baseIds);
  return baseIds.map(id => {
    const alts = (EX[id] && EX[id].alt) || [];
    const pick = alts.find(a => EX[a] && !used.has(a));
    if (pick){ used.add(pick); return pick; }
    return id;
  });
}

function calcStreak(activeDates){
  const set = new Set(activeDates);
  let cursor = new Date();
  const fmt = d => localDateStr(d);
  if (!set.has(fmt(cursor))){ cursor.setDate(cursor.getDate()-1); if(!set.has(fmt(cursor))) return 0; }
  let streak=0;
  while(set.has(fmt(cursor))){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}

function mealKcal(raw){ const m = typeof raw==="string" ? {kcal:null} : raw; return m.kcal || 0; }

function exerciseHistory(exId){
  return STATE.sessions.filter(s=>s.type==="muscu").flatMap(s=>{
    const e = s.entries.find(en=>en.exId===exId);
    return e ? [{date:s.date, sets:e.sets}] : [];
  }).sort((a,b)=> a.date<b.date?1:-1);
}
function suggestedTarget(exId){
  const base = DEFAULT_TARGET[exId] || {sets:3, reps:12};
  const unit = base.unit==="sec" ? "sec" : "reps";
  const history = exerciseHistory(exId);
  if (history.length===0) return {sets:base.sets, reps:base.reps, unit, weight:null, note:"Premier passage sur cet exo — commence léger, priorise la forme correcte."};
  const validSets = (history[0].sets||[]).filter(s=>s.reps!=="");
  if (validSets.length===0) return {sets:base.sets, reps:base.reps, unit, weight:null, note:"Reprends là où tu en étais la dernière fois."};
  const avgReps = validSets.reduce((a,s)=>a+(toNum(s.reps)||0),0)/validSets.length;
  const maxWeight = Math.max(...validSets.map(s=>toNum(s.weight)||0));
  if (avgReps >= base.reps){
    const nextWeight = maxWeight>0 ? Math.round((maxWeight+2.5)*2)/2 : null;
    return {sets:validSets.length, reps:base.reps, unit, weight:nextWeight,
      note: nextWeight ? `Objectif atteint la dernière fois — essaie ${nextWeight}kg (+2.5kg), ou +1-2 ${unit==="sec"?"sec":"reps"} si tu préfères garder le même poids.` : `Objectif atteint la dernière fois — ajoute 1-2 ${unit==="sec"?"sec":"reps"} si tu peux.`};
  }
  return {sets:validSets.length, reps:base.reps, unit, weight:maxWeight||null,
    note:`Reste sur ce poids cette fois, priorité à compléter toutes les ${unit==="sec"?"secondes":"reps"}.`};
}

// Rough deficit trend — both sides (mangé / brûlé) are estimates, so this is a
// directional signal only, never treated as an exact number. The scale's
// actual weight change is always the real source of truth, shown alongside it.
// Important: the watch's "calories brûlées" figure is ACTIVE energy only
// (movement/exercise) — it excludes resting/basal metabolism, which is
// usually 60%+ of total daily burn. So total burn = BMR + active (watch).
function computeBMR(weightKg, profile){
  if (!profile || !profile.age || !profile.heightCm || !weightKg) return null;
  const age = toNum(profile.age), height = toNum(profile.heightCm);
  if (isNaN(age) || isNaN(height)) return null;
  const sexOffset = profile.sex === "f" ? -161 : 5;
  return 10*weightKg + 6.25*height - 5*age + sexOffset;
}
// Personalized daily calorie target: BMR x1.3 (activité légère, le sport actif
// est déjà compté à part via la montre) moins un déficit modéré (350 kcal) —
// stable et progressif pour une recomposition, pas un cut agressif.
// Détecte si aujourd'hui est un jour d'entraînement : séance déjà loguée,
// ou réponse "oui" donnée au prompt du matin.
function isTrainingDayToday(){
  return STATE.sessions.some(s=>s.date===todayStr()) || !!STATE.fiveDays[todayStr()];
}
const DEFAULT_ACTIVE_KCAL = 200; // ton jour de repos habituel, utilisé seulement tant que la montre n'est pas notée
function weightAtDate(date){
  const ws = Object.entries(STATE.daily).filter(([,v])=>v.weight).sort();
  if (!ws.length) return null;
  let w = ws[0][1].weight;
  for (const [d,v] of ws){ if (d<=date) w = v.weight; else break; }
  return w;
}
// Base de calcul (expliquée dans l'app) :
//  - dépense du jour = métabolisme de base (Mifflin-St Jeor) + calories actives de la montre
//  - 1 kg de gras ≈ 7700 kcal
//  - Strict = perte visée ~1 % du poids / semaine, Bien = ~0,7 %, Craqué = entretien (0 perte)
//  - plancher de sécurité : jamais sous 1500 kcal
const fmtKg = k => k>0.05 ? "≈ -"+k.toFixed(1)+" kg/sem" : k<-0.05 ? "≈ +"+Math.abs(k).toFixed(1)+" kg/sem" : "≈ 0 kg/sem";
const FLOOR_KCAL = 1500, STRICT_RATE = 0.010, BIEN_RATE = 0.007;
function kgPerWeek(tdee, intake){ return (tdee-intake)*7/7700; }
function tiersForDate(date){
  const w = weightAtDate(date);
  const bmr = computeBMR(w, STATE.profile);
  if (!bmr) return null;
  const entered = toNum((STATE.daily[date]||{}).watchKcal) || 0;
  const active = entered>0 ? entered : DEFAULT_ACTIVE_KCAL;
  const tdee = bmr + active;
  const defStrict = w*STRICT_RATE*1100, defBien = w*BIEN_RATE*1100; // kcal/jour pour ce % de poids par semaine
  const strict = Math.max(FLOOR_KCAL, Math.round(tdee-defStrict));
  const bien = Math.max(strict+150, Math.round(tdee-defBien));
  const craque = Math.max(bien+250, Math.round(tdee));
  const training = STATE.sessions.some(s=>s.date===date) || !!STATE.fiveDays[date];
  return {bmr:Math.round(bmr), active, activeEntered: entered>0, tdee:Math.round(tdee), strict, bien, craque, training,
    kgStrict:kgPerWeek(tdee,strict), kgBien:kgPerWeek(tdee,bien), kgCraque:kgPerWeek(tdee,craque)};
}
function dailyCalorieTiers(){
  const t = tiersForDate(todayStr());
  return t ? {...t, bonus: t.activeEntered ? t.active : 0} : null;
}
function weeklyDeficitEstimate(){
  const cutoff = addDays(todayStr(), -6);
  const entries = Object.entries(STATE.daily).filter(([d])=>d>=cutoff).map(([,v])=>v);
  const usable = entries.filter(v => v.watchKcal && dayKcalTotal(v) > 0);
  if (!usable.length) return null;
  const weights = Object.entries(STATE.daily).filter(([,v])=>v.weight).sort();
  const latestWeight = weights.length ? weights[weights.length-1][1].weight : null;
  const bmr = computeBMR(latestWeight, STATE.profile);
  if (!bmr) return {needsProfile:true, days: usable.length};
  const avg = usable.reduce((a,v)=> a + ((bmr + toNum(v.watchKcal)) - dayKcalTotal(v)), 0) / usable.length;
  return {avg: Math.round(avg), low: Math.round(avg*0.85), high: Math.round(avg*1.15), days: usable.length, bmr: Math.round(bmr)};
}
// Déficit réel du jour même : métabolisme de base + actives (montre) - repas mangés.
function todayDeficit(entry){
  const weights = Object.entries(STATE.daily).filter(([,v])=>v.weight).sort();
  const latestWeight = weights.length ? weights[weights.length-1][1].weight : null;
  const bmr = computeBMR(latestWeight, STATE.profile);
  if (!bmr) return null;
  const watch = toNum(entry.watchKcal) || 0;
  const eaten = dayKcalTotal(entry);
  return {bmr: Math.round(bmr), watch, eaten, deficit: Math.round(bmr + watch - eaten)};
}
// Résumé léger des 7 derniers jours : combien de jours en déficit, et la moyenne.
function weeklyRecapLite(){
  const cutoff = addDays(todayStr(), -6);
  const days = Object.entries(STATE.daily).filter(([d])=>d>=cutoff && d<=todayStr());
  const usable = days.map(([,v])=>todayDeficit(v)).filter(Boolean).filter(dd=>dd.eaten>0 && dd.watch>0);
  if (!usable.length) return null;
  const inDeficit = usable.filter(dd=>dd.deficit>=0).length;
  const avg = Math.round(usable.reduce((a,dd)=>a+dd.deficit,0)/usable.length);
  return {inDeficit, total: usable.length, avg};
}
// Diagnostic réel : croise le déficit moyen avec la vraie tendance du poids
// pour expliquer POURQUOI ça bouge ou pas, pas juste afficher des chiffres.
function coachingInsight(){
  const recap = weeklyRecapLite();
  if (!recap || recap.total<3) return {icon:"📊", color:"var(--muted)", text:"Pas encore assez de jours notés cette semaine (repas + montre) pour un vrai diagnostic."};
  const weights = Object.entries(STATE.daily).filter(([d,v])=>v.weight && d>=addDays(todayStr(),-14)).sort();
  if (weights.length<2) return {icon:"⚖️", color:"var(--muted)", text:"Note ton poids plus régulièrement pour que je puisse te dire si ça marche vraiment."};
  const trend = weights[weights.length-1][1].weight - weights[0][1].weight;
  const good = recap.avg >= 400;
  if (trend < -0.3) return {icon:"✅", color:"var(--teal)", text:`Ça descend bien (${trend.toFixed(1)}kg) et ton déficit moyen est de ${recap.avg} kcal/j — continue exactement comme ça.`};
  if (trend > 0.3) return good
    ? {icon:"⚠️", color:"var(--gold)", text:`Le poids est monté (+${trend.toFixed(1)}kg) alors que ton déficit a l'air bon — vérifie que tu loggues bien tout (grignotages, sauces, boissons), les portions sont souvent sous-estimées.`}
    : {icon:"⚠️", color:"var(--red)", text:`Le poids est monté (+${trend.toFixed(1)}kg) et ton déficit moyen est faible (${recap.avg} kcal/j) — resserre un peu les repas cette semaine.`};
  return good
    ? {icon:"💧", color:"var(--teal)", text:`Le poids bouge presque pas, mais ton déficit moyen est bon (${recap.avg} kcal/j) — c'est probablement de la rétention d'eau, pas un vrai blocage. Patiente quelques jours.`}
    : {icon:"🍽️", color:"var(--gold)", text:`Le poids stagne et ton déficit moyen est faible (${recap.avg} kcal/j) — c'est probablement la cause. Vise plus près du niveau "Bien" cette semaine.`};
}

const GOAL_TARGET_DATE = "2027-04-30"; // ~0,5 kg/semaine : rythme réaliste en sécurité avec ses jours calmes + five/salle
function trackingCheck(){
  const weights = Object.entries(STATE.daily).filter(([,v])=>v.weight).sort();
  if (weights.length<2) return null; // besoin d'au moins un point de départ + un poids récent
  const startW = weights[0][1].weight;
  const startDate = new Date(weights[0][0]+"T00:00:00");
  const targetDate = new Date(GOAL_TARGET_DATE+"T00:00:00");
  const today = new Date(todayStr()+"T00:00:00");
  const totalDays = (targetDate - startDate) / 86400000;
  if (totalDays<=0) return null;
  const elapsedDays = Math.max(0, (today - startDate) / 86400000);
  const frac = Math.min(1, elapsedDays/totalDays);
  const expected = startW - (startW-GOAL_FINAL)*frac;
  const current = weights[weights.length-1][1].weight;
  const diff = Math.round((current - expected)*10)/10; // positif = en retard (plus lourd que prévu)
  return {expected: Math.round(expected*10)/10, current, diff, onTrack: diff<=0.3};
}
function monthlyMilestones(){
  const weights = Object.entries(STATE.daily).filter(([,v])=>v.weight).sort();
  if (!weights.length) return [];
  const startW = weights[0][1].weight;
  const startDate = new Date(weights[0][0]+"T00:00:00");
  const targetDate = new Date(GOAL_TARGET_DATE+"T00:00:00");
  const totalDays = (targetDate - startDate) / 86400000;
  if (totalDays <= 0) return [];
  const milestones = [];
  let y = startDate.getFullYear(), m = startDate.getMonth();
  let guard = 0;
  while (guard++ < 12){
    const endOfMonth = new Date(y, m+1, 0);
    if (endOfMonth >= targetDate) break;
    const elapsed = (endOfMonth - startDate)/86400000;
    const frac = Math.max(0, Math.min(1, elapsed/totalDays));
    const w = startW - (startW-GOAL_FINAL)*frac;
    milestones.push({label: endOfMonth.toLocaleDateString("fr-FR",{month:"short"}), weight: Math.round(w*10)/10});
    m++;
  }
  milestones.push({label: targetDate.toLocaleDateString("fr-FR",{month:"short"}), weight: GOAL_FINAL});
  return milestones.slice(0,4);
}

          ${isFive && STATE.fiveMoves[date] ? `<p style="font-size:10px;margin:6px 0 0;color:var(--gold);">Muscu décalée → ${fmtWeekday(STATE.fiveMoves[date].to)}${STATE.fiveMoves[date].adj?" (collée à une autre séance)":""}</p>` : ""}
        </div>
        <div class="col gap6" style="align-items:flex-end;">
          ${showGo ? `<button data-action="start-day" data-day="${day.id}" style="background:var(--gold);border-radius:10px;padding:10px 14px;color:#14171C;font-weight:700;font-size:12px;">▶ Go</button>` : ""}

            <button data-action="toggle-five" data-date="${date}" style="font-size:17px;padding:4px;${isFive?"":"opacity:.45;"}">⚽</button>
            <button data-action="toggle-swap-picker" data-date="${date}" style="color:var(--muted);font-size:17px;padding:4px;">🔀</button>

      ${isSwapped ? `<button data-action="clear-swap" data-date="${date}" style="margin-top:8px;font-size:11px;color:var(--red);">↺ Annuler l'échange</button>` : ""}
      ${pickerOpen ? `<div class="col gap6" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
        <p class="muted" style="font-size:11px;">Échanger avec quel jour ?</p>
        ${weekDates.filter(d2=>d2!==date).map(d2=>{
          const day2 = slotForDate(d2);
          return `<button data-action="do-swap" data-date-a="${date}" data-date-b="${d2}" class="row between" style="background:var(--surface-alt);border-radius:8px;padding:8px 10px;width:100%;text-align:left;">
            <span style="font-size:12px;text-transform:capitalize;">${fmtWeekday(d2)} · ${fmtDate(d2)}</span>
            <span style="font-size:12px;color:var(--muted);">${esc(day2.label)}</span>

      </div>` : ""}
    </div>`;
  });

  return `
    <div class="col gap14">
      <div class="row between">
        <div>
          <p class="muted" style="font-size:13px;text-transform:capitalize;margin:0;">${fmtWeekday(todayStr())} ${fmtDate(todayStr())}</p>
          <h1 class="display" style="font-size:32px;margin:2px 0 0;">Salut 👊</h1>
        </div>
        <div class="row gap6" style="color:${streak>0?"var(--gold)":"var(--muted)"};">
          <span style="font-size:20px;">🔥</span><span class="mono" style="font-weight:700;font-size:18px;">${streak}</span>
        </div>
      </div>
      ${doneToday ? `<p style="color:var(--teal);font-size:12px;margin:0;">✓ Séance du jour déjà validée</p>` : ""}
      ${(()=>{
        const cc = consistencyComparison();
        if (cc.thisWeek===0 && cc.lastWeek===0) return "";
        const better = cc.diff>0, same = cc.diff===0;
        return `<p style="font-size:12px;margin:0;color:${better?"var(--teal)":same?"var(--muted)":"var(--red)"};">
          📆 <span class="mono" style="font-weight:800;">${cc.thisWeek}/7</span> jours actifs cette semaine <span class="mono">(${cc.lastWeek}/7</span> la semaine dernière)${better?" — mieux que la semaine dernière":same?"":" — moins que la semaine dernière"}
        </p>`;
      })()}
      ${(()=>{
        const training = isTrainingDayToday();
        const todayEntryW = STATE.daily[todayStr()] || {};
        const weighInNeeded = !todayEntryW.weight;
        const tiers = dailyCalorieTiers();
        if (!tiers) return `<div class="card"><p class="muted" style="font-size:12px;margin:0;">Renseigne ton profil (âge/taille, onglet Métabo) et ton poids pour voir ton plafond kcal du jour.</p></div>`;
        return `<div class="card">
          <p style="font-size:13px;font-weight:700;margin:0 0 2px;">${STATE.fiveDays[todayStr()]?"⚽ Jour de five":training?"🏋️ Jour de sport":"🛋️ Jour de repos"} — ton plafond aujourd'hui</p>
          <p class="muted" style="font-size:11px;margin:0 0 10px;">${tiers.activeEntered ? `Calories actives de ta montre : ${tiers.active}.` : `Montre pas encore notée : j'estime ${tiers.active} kcal actives (ton jour de repos habituel). Remplis-la ce soir dans le Journal et tout se recalcule.`}</p>
          <div class="grid3">
            <div style="text-align:center;padding:10px 4px;background:var(--surface-alt);border-radius:2px;">
              <p class="muted" style="font-size:10px;margin:0;text-transform:uppercase;">Strict</p>
              <p class="mono" style="font-size:16px;color:var(--teal);font-weight:800;margin:4px 0 0;">${tiers.strict}</p>
              <p class="muted" style="font-size:9px;margin:2px 0 0;">${fmtKg(tiers.kgStrict)}</p>
            </div>
            <div style="text-align:center;padding:10px 4px;background:var(--surface-alt);border-radius:2px;border:1px solid var(--gold);">
              <p class="muted" style="font-size:10px;margin:0;text-transform:uppercase;">Bien</p>
              <p class="mono" style="font-size:16px;color:var(--gold);font-weight:800;margin:4px 0 0;">${tiers.bien}</p>
              <p class="muted" style="font-size:9px;margin:2px 0 0;">${fmtKg(tiers.kgBien)}</p>
            </div>
            <div style="text-align:center;padding:10px 4px;background:var(--surface-alt);border-radius:2px;">
              <p class="muted" style="font-size:10px;margin:0;text-transform:uppercase;">Craqué</p>
              <p class="mono" style="font-size:16px;color:var(--red);font-weight:800;margin:4px 0 0;">${tiers.craque}</p>
              <p class="muted" style="font-size:9px;margin:2px 0 0;">${fmtKg(tiers.kgCraque)}</p>
            </div>
          </div>
          <button data-action="toggle-tier-info" style="margin-top:10px;font-size:11px;color:var(--muted);font-weight:700;">${STATE.showTierInfo?"✕ Fermer":"ℹ️ Comment c'est calculé ?"}</button>
          ${STATE.showTierInfo ? `<div class="muted" style="font-size:11px;line-height:1.55;margin-top:8px;">
            <p style="margin:0 0 6px;"><b style="color:var(--text);">Ta dépense du jour</b> = ton métabolisme de base (${tiers.bmr} kcal, calculé avec poids, taille, âge) + les calories actives de ta montre (${tiers.active}) = <b style="color:var(--text);">${tiers.tdee} kcal</b>.</p>
            <p style="margin:0 0 6px;">1 kg de gras ≈ 7 700 kcal. Donc manger X kcal sous ta dépense te fait perdre à peu près X × 7 / 7 700 kg par semaine.</p>
            <p style="margin:0 0 6px;"><b style="color:var(--teal);">Strict</b> vise ~1 % de ton poids par semaine, <b style="color:var(--gold);">Bien</b> ~0,7 %, <b style="color:var(--red);">Craqué</b> = ton entretien (tu perds rien, tu prends rien).</p>
            <p style="margin:0;">Plancher de sécurité : jamais sous ${FLOOR_KCAL} kcal. Les jours calmes il bloque la vitesse : pour aller plus vite, il faut dépenser plus (five, salle), pas manger moins.</p>
          </div>` : ""}
          ${weighInNeeded ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);">
            <p class="muted" style="font-size:11px;margin:0 0 8px;">Pesée du matin :</p>
            <div class="row gap6"><input id="input-weight" type="text" inputmode="decimal" placeholder="kg" value="${esc(todayEntryW.weight||"")}" class="mono" style="flex:1;">
            <button data-action="save-field" data-field="weight" style="background:var(--gold);border-radius:2px;padding:0 12px;color:#0A0A0A;font-weight:700;">✓</button></div>
          </div>` : ""}
        </div>`;
      })()}
      ${currentWeight ? `<div class="card">
        <div class="row between" style="margin-bottom:8px;"><div class="row gap8"><span>🎯</span><span style="font-weight:700;font-size:14px;">Objectif : ${GOAL_FINAL}kg</span></div><span class="mono" style="color:var(--gold);font-size:13px;">${Math.max(0,currentWeight-GOAL_FINAL).toFixed(1)}kg restants</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${startWeight>GOAL_FINAL?Math.min(100,Math.max(0,((startWeight-currentWeight)/(startWeight-GOAL_FINAL))*100)):100}%;background:var(--gold);"></div></div>
        <p class="muted" style="font-size:11px;margin:8px 0 0;">Actuel : ${currentWeight}kg${etaText?` · ${etaText}`:""}</p>
        ${(()=>{
          const tc = trackingCheck();
          if (!tc) return "";
          return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
            <p style="font-size:12px;margin:0;color:${tc.onTrack?"var(--teal)":"var(--red)"};font-weight:700;">${tc.onTrack ? `✓ Dans les temps (prévu ~${tc.expected}kg aujourd'hui)` : `⚠ En retard de ${tc.diff}kg sur la trajectoire (prévu ~${tc.expected}kg aujourd'hui)`}</p>
          </div>`;
        })()}
        ${milestones.length ? `<div class="row gap6" style="margin-top:10px;flex-wrap:wrap;">${milestones.map(m=>`<span class="pill" style="background:var(--surface-alt);color:var(--muted);">${esc(m.label)} · ~${m.weight}kg</span>`).join("")}</div>` : ""}
      </div>` : `<div class="card"><p class="muted" style="font-size:12px;margin:0;">Note ton poids dans le Journal pour suivre ta progression vers ${GOAL_FINAL}kg.</p></div>`}
      ${(()=>{
        const t = dailyCalorieTiers();
        if (!t) return "";
        const rep = intakeReport();
        const eaten = dayKcalTotal(STATE.daily[todayStr()]||{});
        const st = intakeStatus(eaten, t);
        const earlyDay = new Date().getHours() < 20;
        const stLabel = (st==="low" && earlyDay) ? "En cours" : INTAKE_META[st].label;
        const stColor = (st==="low" && earlyDay) ? "var(--muted)" : INTAKE_META[st].color;
        const scale = t.craque*1.08;
        const pos = v => Math.min(100, (v/scale)*100);
        const left = t.bien - eaten;
        const line = !eaten ? "Rien noté aujourd'hui pour l'instant."
          : left>=0 ? `Il te reste ${left} kcal pour rester sur Bien.`
          : eaten<=t.craque ? `Tu dépasses Bien de ${-left} kcal (encore sous Craqué).`
          : `Tu es au-dessus même de Craqué, de ${eaten-t.craque} kcal.`;
        const bars = rep.days.map(d=>{
          const h = d.t && d.eaten ? Math.max(6, Math.min(100, (d.eaten/(d.t.craque*1.08))*100)) : 6;
          const col = (d.status==="low" && d.isToday && earlyDay) ? "var(--muted)" : INTAKE_META[d.status].color;
          return `<div style="flex:1;text-align:center;">
            <div style="height:44px;display:flex;align-items:flex-end;justify-content:center;"><div style="width:70%;height:${h}%;background:${col};border-radius:2px;${d.isToday?"outline:1px solid var(--text);":""}"></div></div>
            <p class="muted" style="font-size:9px;margin:3px 0 0;text-transform:uppercase;">${fmtWeekday(d.date).slice(0,1)}</p>
          </div>`;
        }).join("");
        return `<div class="card">
          <div class="row between" style="margin-bottom:8px;">
            <span style="font-size:13px;font-weight:700;">🍽️ Ce que tu manges</span>
            <span class="mono" style="font-size:12px;color:${stColor};font-weight:800;">${eaten} kcal · ${stLabel}</span>
          </div>
          <div style="position:relative;height:10px;background:var(--bg);border:1px solid var(--line);border-radius:2px;margin:4px 0 16px;">
            <div style="height:100%;width:${pos(eaten)}%;background:${stColor};"></div>
            ${[["Strict",t.strict],["Bien",t.bien],["Craqué",t.craque]].map(([n,v])=>`<div style="position:absolute;top:-3px;left:${pos(v)}%;width:2px;height:16px;background:var(--text);opacity:.5;"></div><span class="mono" style="position:absolute;top:13px;left:${pos(v)}%;transform:translateX(-50%);font-size:9px;color:var(--muted);">${n} ${v}</span>`).join("")}
          </div>
          <p style="font-size:12px;margin:0 0 12px;">${line}</p>
          <div class="row gap6" style="margin-bottom:12px;">${bars}</div>
          <p style="font-size:12px;margin:0;line-height:1.5;"><span style="font-size:15px;">${rep.verdict.icon}</span> <span style="color:${rep.verdict.color};">${esc(rep.verdict.text)}</span></p>
        </div>`;
      })()}
      ${(()=>{
        const insight = coachingInsight();
        return `<div class="card" style="padding:14px 16px;">
          <p style="font-size:12px;margin:0;line-height:1.5;"><span style="font-size:15px;">${insight.icon}</span> <span style="color:${insight.color};">${esc(insight.text)}</span></p>
        </div>`;
      })()}
      <div class="card" style="${lowWater?"border-color:var(--red);":""}">
        <div class="row between" style="margin-bottom:8px;">
          <div class="row gap8"><span>💧</span><span style="font-weight:700;font-size:14px;">Eau aujourd'hui</span></div>
          <span class="mono" style="font-size:13px;color:var(--teal);">${today.water||0} / ${WATER_TARGET} ml</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${waterPct}%;background:${lowWater?"var(--red)":"var(--teal)"};"></div></div>
        ${lowWater ? `<p style="font-size:11px;color:var(--red);margin:8px 0 0;">⚠ Moins de la moitié en fin de journée — pense à boire un coup</p>` : ""}
      </div>
      <div>
        <p class="muted" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0 0 8px;">Ta semaine</p>
        <div class="col gap8">${strip}</div>
      </div>
      <button data-action="goto" data-tab="daily" class="row center gap8" style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;">
        📋 <span style="font-weight:700;font-size:13px;">Log du jour</span>
      </button>
    </div>`;
}

function renderProgram(){
  const todayWd = fmtWeekday(todayStr()).toLowerCase();
  const days = STATE.program.days.map(day=>{
    const meta = TYPE_META[day.type];
    const isOpen = STATE.openProgramDay === day.id;
    const isToday = day.weekday.toLowerCase() === todayWd;
    let inner = "";
    if (day.type==="muscu"){
      const thisWeek = weeklyExercises(day.exercises, todayStr());
      inner = day.exercises.map((eid,idx)=>{
        const displayId = thisWeek[idx];
        const variant = displayId!==eid;
        return `<button class="row between" data-action="open-modal" data-ex="${displayId}" style="background:var(--surface-alt);padding:10px 12px;border-radius:10px;width:100%;text-align:left;">
          <span style="font-size:13px;">${esc(EX[displayId].name)}${variant?' <span style="color:var(--gold);font-size:10px;">🔄 variante cette semaine</span>':""}</span>
          <span class="muted">ⓘ</span>
        </button>`;
      }).join("");
    } else if (day.type==="cardio"){
      const target = suggestedCardioTarget(day);
      inner = `<div style="padding:6px 2px;">
        <p style="font-size:13px;font-weight:700;margin:0;">${esc(target.proto.label)}</p>
        <p class="muted" style="font-size:12px;margin:4px 0 0;">${esc(target.proto.why)}</p>
        <div style="margin-top:8px;">${target.segments.map(s=>`
          <div class="row between" style="background:var(--surface-alt);border-radius:8px;padding:8px 10px;margin-bottom:6px;">
            <span style="font-size:12px;">${esc(s.label)}</span>
            <span class="mono" style="font-size:11px;color:var(--gold);">${s.minutes}min · ${s.incline}% · ${s.speed}km/h</span>
          </div>`).join("")}</div>
      </div>`;
    } else {
      inner = `<p class="muted" style="font-size:13px;padding:6px 2px;">Repos complet ou piscine/sauna léger si t'en as envie.</p>`;
    }
    return `<div class="card" style="padding:0;overflow:hidden;${isToday?"border-color:var(--gold);background:rgba(215,255,63,.08);":""}">
      <button class="row between" data-action="toggle-day" data-day="${day.id}" style="width:100%;padding:14px;text-align:left;">
        <div><p class="muted" style="font-size:11px;margin:0;">${esc(day.weekday)}${isToday?` <span style="color:var(--gold);font-weight:700;">· AUJOURD'HUI</span>`:""}</p><p style="font-weight:700;font-size:14px;margin:2px 0 6px;">${esc(day.label)}</p>${pill(meta.label,meta.color)}</div>
        <span style="transform:rotate(${isOpen?180:0}deg);transition:.2s;">⌄</span>
      </button>
      ${isOpen ? `<div class="col gap6" style="padding:0 14px 14px;">${inner}</div>` : ""}
    </div>`;
  }).join("");

  return `<div class="col gap10">
    <h1 class="display" style="font-size:28px;margin:0;">Programme</h1>
    <p class="muted" style="margin-top:-8px;">Full Body x3/semaine + cardio. Les exos alternent automatiquement une semaine sur deux pour casser la routine.</p>
    ${days}
  </div>`;
}

// ---------------------------------------------------------------------------
// TAB: SESSION (guided)
// ---------------------------------------------------------------------------
function captureCurrentStepInputs(){
  if (!STATE.activeDay || STATE.activeDay.type!=="muscu") return;
  const exId = STATE.activeDay.exercises[STATE.guidedStep];
  const rows = STATE.guidedSets[exId] || [];
  rows.forEach((row,i)=>{
    const w = document.getElementById(`set-w-${i}`), r = document.getElementById(`set-r-${i}`);
    if (w) row.weight = w.value;
    if (r) row.reps = r.value;
  });
}
function captureCardioForm(){
  const d = document.getElementById("cardio-duration"), c = document.getElementById("cardio-calories"), h = document.getElementById("cardio-hr");
  if (d) STATE.cardioForm.duration = d.value;
  if (c) STATE.cardioForm.calories = c.value;
  if (h) STATE.cardioForm.hr = h.value;
}

// Real-time autosave of an in-progress session — so nothing is lost if the
// phone locks, a call comes in, or the app gets closed mid-séance.
function saveActiveSession(){
  if (!STATE.activeDay){ localStorage.removeItem(LS.activeSession); return; }
  save(LS.activeSession, {
    date: todayStr(), activeDay: STATE.activeDay, guidedStep: STATE.guidedStep,
    guidedSets: STATE.guidedSets, cardioForm: STATE.cardioForm,
  });
}
function clearActiveSession(){ localStorage.removeItem(LS.activeSession); }
function restoreActiveSession(){
  const saved = load(LS.activeSession, null);
  if (!saved || saved.date !== todayStr()) { clearActiveSession(); return; }
  STATE.activeDay = saved.activeDay;
  STATE.guidedStep = saved.guidedStep || 0;
  STATE.guidedSets = saved.guidedSets || {};
  STATE.cardioForm = saved.cardioForm || {activity:"Tapis", duration:"", calories:"", hr:""};
  STATE.tab = "session";
}

function startDay(dayId){
  const day = STATE.program.days.find(d=>d.id===dayId);
  if (!day) return;
  const dateStr = todayStr();
  if (day.type==="muscu"){
    const exercises = weeklyExercises(day.exercises, dateStr);
    STATE.activeDay = {...day, exercises};
    STATE.guidedStep = 0;
    STATE.guidedSets = {};
    exercises.forEach(id=>{
      const hist = exerciseHistory(id);
      const lastSets = hist.length ? hist[0].sets.filter(s=>s.reps!=="") : [];
      STATE.guidedSets[id] = lastSets.length
        ? lastSets.map(s=>({weight: s.weight||"", reps:""}))
        : [{weight:"",reps:""},{weight:"",reps:""},{weight:"",reps:""}];
    });
  } else {
    STATE.activeDay = {...day};
    STATE.cardioForm = {activity:"Tapis", duration:"", calories:"", hr:""};
  }
  STATE.tab = "session";
  STATE.justFinished = false;
  STATE.exercisePickerOpen = false;
  STATE.showSwapPanel = false;
  STATE.showExerciseDetail = false;
  saveActiveSession();
  render();
}

function sessionVolume(session){
  if (!session || session.type!=="muscu") return 0;
  return session.entries.reduce((a,e)=>a + e.sets.reduce((b,s)=>b + (toNum(s.weight)||0)*(toNum(s.reps)||0), 0), 0);
}
function finishMuscu(){
  captureCurrentStepInputs();
  const entries = Object.entries(STATE.guidedSets)
    .map(([exId,s])=>({exId, sets:s.filter(x=>x.reps!=="")}))
    .filter(e=>e.sets.length>0);
  if (entries.length===0){ return; }
  const session = {id:Date.now(), date:todayStr(), dayId:STATE.activeDay.id, type:"muscu", entries};
  const prevSession = STATE.sessions.find(s=>s.type==="muscu" && s.dayId===STATE.activeDay.id);
  const newVolume = Math.round(sessionVolume(session));
  const prevVolume = prevSession ? Math.round(sessionVolume(prevSession)) : null;
  STATE.lastMuscuComparison = {volume: newVolume, diff: prevVolume!=null ? newVolume-prevVolume : null};
  STATE.sessions = [session, ...STATE.sessions];
  save(LS.sessions, STATE.sessions);
  clearActiveSession();
  // Le cardio fait partie intégrante de chaque séance muscu — on enchaîne direct,
  // pas une option à part.
  const cardioDay = STATE.program.days.find(d=>d.type==="cardio");
  if (cardioDay){
    STATE.muscuJustDone = true;
    startDay(cardioDay.id);
  } else {
    STATE.activeDay = null; STATE.justFinished = true; STATE.lastFinishedType = "muscu";
    render();
  }
}
function finishCardio(){
  captureCardioForm();
  if (!STATE.cardioForm.duration) return;
  const session = {id:Date.now(), date:todayStr(), dayId:STATE.activeDay.id, type:"cardio", cardioKind: STATE.activeDay.cardioKind || "steady", ...STATE.cardioForm};
  STATE.sessions = [session, ...STATE.sessions];
  save(LS.sessions, STATE.sessions);
  STATE.activeDay = null; STATE.justFinished = true;
  STATE.lastFinishedType = STATE.muscuJustDone ? "combined" : "cardio";
  STATE.muscuJustDone = false;
  clearActiveSession();
  render();
}

function renderSession(){
  if (STATE.justFinished){
    const cmp = STATE.lastMuscuComparison;
    const todayWatch = toNum((STATE.daily[todayStr()]||{}).watchKcal);
    return `<div class="col center gap14" style="align-items:center;text-align:center;padding:50px 20px;">
      <span style="font-size:48px;">🏆</span>
      <h2 class="display" style="font-size:26px;margin:0;">Séance enregistrée</h2>
      <p class="muted">${STATE.lastFinishedType==="combined"?"Muscu + cardio, séance complète.":"Bien joué. Continue comme ça."}</p>
      ${cmp ? `<div class="card" style="width:100%;">
        <div class="grid2">
          <div style="text-align:center;">
            <p class="muted" style="font-size:10px;margin:0;text-transform:uppercase;">Volume soulevé</p>

const MEAL_PRESETS = ["Déjeuner","Dîner","Collation"];
const MEAL_BUDGET_SPLIT = {"Déjeuner":0.45, "Dîner":0.40, "Collation":0.15};
function mealTagOf(raw){
  const m = typeof raw==="string" ? {text:raw} : raw;
  for (const p of MEAL_PRESETS){ if ((m.text||"").startsWith(p+" : ")) return p; }
  return null;
}
function kcalByMealTag(entry){
  const totals = {}; MEAL_PRESETS.forEach(p=>totals[p]=0);
  (entry.meals||[]).forEach(raw=>{ const tag = mealTagOf(raw); if (tag) totals[tag] += mealKcal(raw); });
  return totals;
}

function renderDaily(){
  const date = todayStr();
  const entry = STATE.daily[date] || {water:0, weight:"", sleep:"", meals:[], watchKcal:""};
  const waterPct = Math.min(100, ((entry.water||0)/WATER_TARGET)*100);
  const recentDays = Object.entries(STATE.daily).sort((a,b)=>(a[0]<b[0]?1:-1)).slice(0,7);
  const chips = MEAL_PRESETS.map(p=>`<button data-action="set-meal-tag" data-value="${p}" style="font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;background:${STATE.mealTag===p?"var(--gold)":"var(--surface-alt)"};color:${STATE.mealTag===p?"#14171C":"var(--muted)"};">${p}</button>`).join("");
  const meals = (entry.meals||[]).map((raw,i)=>{
    const m = typeof raw==="string" ? {text:raw, kcal:null} : raw;
    return `<div class="row between" style="background:var(--surface-alt);border-radius:8px;padding:8px 10px;">
      <span style="font-size:13px;">${esc(m.text)}${m.kcal?` <span class="mono" style="color:var(--gold);">· ~${m.kcal} kcal</span>`:""}</span>
      <button data-action="remove-meal" data-idx="${i}" class="muted">✕</button>
    </div>`;
  }).join("");
  const totalKcal = dayKcalTotal(entry);
  const tiersForBudget = dailyCalorieTiers();
  const myKcalTarget = tiersForBudget ? tiersForBudget.bien : KCAL_TARGET;
  const mealTotals = kcalByMealTag(entry);
  const mealBudgets = {}; MEAL_PRESETS.forEach(p=>{ mealBudgets[p] = Math.round(myKcalTarget*MEAL_BUDGET_SPLIT[p]); });
  const kcalPct = Math.min(100, (totalKcal/myKcalTarget)*100);
  const yEntry = STATE.daily[addDays(date,-1)] || {};
  const weightDelta = (entry.weight && yEntry.weight) ? (entry.weight - yEntry.weight) : null;
  const sleepPct = entry.sleep ? Math.min(100, (entry.sleep/SLEEP_TARGET)*100) : 0;
  const weights = Object.entries(STATE.daily).filter(([,v])=>v.weight).sort();
  const startW = weights.length ? weights[0][1].weight : null;
  const weightGoalPct = (entry.weight && startW && startW>GOAL_FINAL) ? Math.min(100,Math.max(0,((startW-entry.weight)/(startW-GOAL_FINAL))*100)) : null;
  const foodMatchesHTML = STATE.foodMatches.length ? `<div class="col gap6" style="margin:8px 0 12px;">${STATE.foodMatches.map(item=>`
    <button data-action="add-food-match" data-id="${item.id}" class="row between" style="background:var(--surface-alt);border-radius:8px;padding:8px 10px;width:100%;text-align:left;">
      <span style="font-size:13px;">${esc(item.name)} <span class="muted">(${esc(item.portion)})</span></span>
      <span class="mono" style="color:var(--gold);font-size:12px;">~${item.kcal} kcal</span>
    </button>`).join("")}</div>` : (STATE.foodQuery ? `<p class="muted" style="font-size:12px;margin:8px 0 12px;">Rien trouvé — ajoute-le en texte libre en dessous, ou crée-le en aliment perso.</p>` : "");
  const freq = frequentFoods(8);
  const recent = recentDays.map(([d,v])=>`<div class="row between" style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;">
    <span class="muted" style="font-size:12px;">${fmtDate(d)}</span>
    <div class="row gap10 mono" style="font-size:11px;">${v.weight?`<span>${v.weight}kg</span>`:""}${v.sleep?`<span>${v.sleep}h</span>`:""}${v.water>0?`<span>${v.water}ml</span>`:""}${dayKcalTotal(v)>0?`<span>${dayKcalTotal(v)}kcal</span>`:""}</div>
  </div>`).join("");

  return `<div class="col gap14">
    <h1 class="display" style="font-size:28px;margin:0;">Log du jour</h1>
    <div class="card">
      <div class="row between" style="margin-bottom:8px;"><div class="row gap8"><span>💧</span><span style="font-weight:700;font-size:14px;">Eau</span></div><span class="mono" style="color:var(--teal);font-size:13px;">${entry.water||0} / ${WATER_TARGET} ml</span></div>
      <div class="bar-bg" style="margin-bottom:10px;"><div class="bar-fill" style="width:${waterPct}%;background:var(--teal);"></div></div>
      <div class="row gap8">
        <button data-action="add-water" data-ml="250" class="row center gap6" style="flex:1;background:var(--surface-alt);border-radius:8px;padding:10px 0;font-size:13px;font-weight:700;">➕ 250ml</button>
        <button data-action="add-water" data-ml="500" class="row center gap6" style="flex:1;background:var(--surface-alt);border-radius:8px;padding:10px 0;font-size:13px;font-weight:700;">➕ 500ml</button>

      <div class="row gap8" style="margin-top:8px;">

    <div class="grid2">

        <button data-action="save-field" data-field="weight" style="background:var(--gold);border-radius:8px;padding:0 10px;color:#14171C;font-weight:700;">✓</button></div>
        ${weightGoalPct!=null ? `<div class="bar-bg" style="margin-top:8px;height:6px;"><div class="bar-fill" style="width:${weightGoalPct}%;background:var(--gold);"></div></div>` : ""}
        ${entry.weight ? `<p class="muted" style="font-size:10px;margin:6px 0 0;color:var(--teal);">✓ ${entry.weight}kg${weightDelta!=null ? ` <span style="color:${weightDelta<0?"var(--teal)":weightDelta>0?"var(--red)":"var(--muted)"};">(${weightDelta>0?"+":""}${weightDelta.toFixed(1)}kg vs hier)</span>` : (yEntry.weight?"":"")}</p>` : (yEntry.weight ? `<p class="muted" style="font-size:10px;margin:6px 0 0;">Hier : ${yEntry.weight}kg</p>` : "")}
      </div>
      <div class="card"><div class="row gap8" style="margin-bottom:8px;"><span>😴</span><span style="font-size:13px;font-weight:700;">Sommeil</span></div>
        <div class="row gap6"><input id="input-sleep" type="text" inputmode="decimal" placeholder="heures" value="${esc(entry.sleep)}" class="mono" style="flex:1;">

        <div class="bar-bg" style="margin-top:8px;height:6px;"><div class="bar-fill" style="width:${sleepPct}%;background:var(--teal);"></div></div>
        <p class="muted" style="font-size:10px;margin:6px 0 0;${entry.sleep?"color:var(--teal);":""}">${entry.sleep?`✓ ${entry.sleep}h / ${SLEEP_TARGET}h`:`Objectif ${SLEEP_TARGET}h`}${yEntry.sleep?` · hier ${yEntry.sleep}h`:""}</p>
      </div>
    </div>
    <div class="card">
      <div class="row gap8" style="margin-bottom:8px;"><span>⌚</span><span style="font-size:13px;font-weight:700;">Calories brûlées (montre)</span></div>
      <div class="row gap6"><input id="input-watch-kcal" type="text" inputmode="decimal" placeholder="kcal, d'après ta montre" value="${esc(entry.watchKcal||"")}" class="mono" style="flex:1;">
      <button data-action="save-field" data-field="watchKcal" style="background:var(--gold);border-radius:8px;padding:0 10px;color:#14171C;font-weight:700;">✓</button></div>
      ${entry.watchKcal ? `<p class="muted" style="font-size:10px;margin:6px 0 0;color:var(--teal);">✓ ${entry.watchKcal} kcal${yEntry.watchKcal?` · hier ${yEntry.watchKcal}kcal`:""}</p>` : (yEntry.watchKcal ? `<p class="muted" style="font-size:10px;margin:6px 0 0;">Hier : ${yEntry.watchKcal} kcal</p>` : "")}
      ${(()=>{
        const dd = todayDeficit(entry);
        if (dd && !entry.watchKcal) return `<p class="muted" style="font-size:10px;margin:8px 0 0;">Note tes calories actives (montre) pour voir ton déficit réel du jour.</p>`;
        if (!dd) return `<p class="muted" style="font-size:10px;margin:8px 0 0;">Renseigne ton profil (onglet Métabo) pour voir ton déficit réel du jour.</p>`;
        const positive = dd.deficit >= 0;
        return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
          <div class="row between"><span class="muted" style="font-size:11px;">Déficit du jour</span><span class="mono" style="font-size:15px;font-weight:800;color:${positive?"var(--teal)":"var(--red)"};">${positive?"":"+"}${Math.abs(dd.deficit)} kcal${positive?"":" (surplus)"}</span></div>
          <p class="muted" style="font-size:10px;margin:4px 0 0;">${dd.bmr} (base) + ${dd.watch} (actives) − ${dd.eaten} (mangé)</p>
        </div>`;
      })()}

      <div class="bar-bg" style="margin-bottom:12px;"><div class="bar-fill" style="width:${kcalPct}%;background:var(--gold);"></div></div>
      <div class="col gap6" style="margin-bottom:12px;">
        ${MEAL_PRESETS.map(p=>{
          const spent = mealTotals[p], budget = mealBudgets[p];
          const over = spent > budget;
          const pct = Math.min(100, (spent/budget)*100);
          return `<div>
            <div class="row between" style="margin-bottom:2px;"><span class="muted" style="font-size:11px;">${esc(p)}</span><span class="mono" style="font-size:11px;color:${over?"var(--red)":"var(--muted)"};">${spent} / ${budget} kcal</span></div>

function weightChartSVG(){
  const data = Object.entries(STATE.daily).filter(([,v])=>v.weight).sort((a,b)=>a[0]>b[0]?1:-1).map(([d,v])=>({date:fmtDate(d), poids:v.weight}));
  if (data.length<2) return `<p class="muted">Note ton poids au moins 2 jours pour voir le graphique.</p>`;
  const w=300,h=150,pad=26;
  const xs = data.map((_,i)=> pad + i*((w-2*pad)/(data.length-1)));
  const vals = data.map(d=>d.poids);
  const min=Math.min(...vals)-1, max=Math.max(...vals)+1;
  const ys = vals.map(v => h-pad - ((v-min)/(max-min))*(h-2*pad));
  const points = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const dots = xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3" fill="#E3A83B"/>`).join("");

  // Simple linear regression trend line
  const n = vals.length;
  const sumX = vals.reduce((a,_,i)=>a+i,0);
  const sumY = vals.reduce((a,v)=>a+v,0);
  const sumXY = vals.reduce((a,v,i)=>a+i*v,0);
  const sumXX = vals.reduce((a,_,i)=>a+i*i,0);
  const denom = (n*sumXX - sumX*sumX) || 1;
  const slope = (n*sumXY - sumX*sumY) / denom;
  const intercept = (sumY - slope*sumX) / n;
  const trendYRaw = [0, n-1].map(i => intercept + slope*i);
  const trendY = trendYRaw.map(v => h-pad - ((v-min)/(max-min))*(h-2*pad));
  const trendLine = `<line x1="${xs[0].toFixed(1)}" y1="${trendY[0].toFixed(1)}" x2="${xs[xs.length-1].toFixed(1)}" y2="${trendY[1].toFixed(1)}" stroke="#37C6A0" stroke-width="1.5" stroke-dasharray="4 3"/>`;

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:160px;">
    ${trendLine}
    <polyline points="${points}" fill="none" stroke="#E3A83B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${pad}" y="${h-4}" fill="#8B95A1" font-size="9">${esc(data[0].date)}</text>
    <text x="${w-pad}" y="${h-4}" fill="#8B95A1" font-size="9" text-anchor="end">${esc(data[data.length-1].date)}</text>
  </svg>
  <p class="muted" style="font-size:11px;margin-top:6px;"><span style="color:#37C6A0;">┄</span> tendance générale</p>`;
}

function copySessionSummary(sessionId){
  const s = STATE.sessions.find(x=>String(x.id)===String(sessionId));
  if (!s) return;
  let text = `Séance du ${fmtDate(s.date)}\n`;
  if (s.type === "muscu"){
    text += "Musculation\n";
    s.entries.forEach(e=>{
      const name = EX[e.exId] ? EX[e.exId].name : e.exId;
      const sets = e.sets.map(x=>`${x.weight||"-"}kg x${x.reps||"-"}`).join(", ");
      text += `- ${name} : ${sets}\n`;
    });
  } else {
    text += `Cardio · ${s.activity||""}\n${s.duration} min${s.calories?` · ${s.calories} kcal`:""}${s.hr?` · FC moy ${s.hr}`:""}\n`;
  }
  const done = () => alert("Résumé copié !");
  const fail = () => alert("Impossible de copier automatiquement, voici le résumé :\n\n"+text);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fail);
    } else { fail(); }
  } catch(e){ fail(); }
}

function exportData(){
  const data = {

    weekOverrides: STATE.weekOverrides, fiveDays: STATE.fiveDays, fiveMoves: STATE.fiveMoves, profile: STATE.profile, exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `fittrack-sauvegarde-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.program) { STATE.program = data.program; save(LS.program, STATE.program); }
      if (data.sessions) { STATE.sessions = data.sessions; save(LS.sessions, STATE.sessions); }
      if (data.daily) { STATE.daily = data.daily; save(LS.daily, STATE.daily); }
      if (data.fiveMoves) { STATE.fiveMoves = data.fiveMoves; save(LS.fiveMoves, STATE.fiveMoves); }
      if (data.fiveDays) { STATE.fiveDays = data.fiveDays; save(LS.fiveDays, STATE.fiveDays); }
      if (data.weekOverrides) { STATE.weekOverrides = data.weekOverrides; save(LS.weekOverrides, STATE.weekOverrides); }
      if (data.profile) { STATE.profile = data.profile; save(LS.profile, STATE.profile); }
      alert("Sauvegarde restaurée !");
      render();
    } catch(err){
      alert("Fichier invalide, impossible de restaurer.");
    }
  };
  reader.readAsText(file);
}

document.addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  if (action==="goto"){ STATE.tab = btn.dataset.tab; STATE.justFinished=false; render(); }
  else if (action==="start-day"){ startDay(btn.dataset.day); }
  else if (action==="toggle-swap-picker"){ STATE.swapPickerDate = STATE.swapPickerDate===btn.dataset.date ? null : btn.dataset.date; render(); }
  else if (action==="do-swap"){ swapDays(btn.dataset.dateA, btn.dataset.dateB); STATE.swapPickerDate = null; render(); }
  else if (action==="clear-swap"){ clearSwap(btn.dataset.date); render(); }
  else if (action==="toggle-day"){ STATE.openProgramDay = STATE.openProgramDay===btn.dataset.day ? null : btn.dataset.day; render(); }
  else if (action==="open-modal"){ STATE.modalExId = btn.dataset.ex; render(); }
  else if (action==="close-modal"){ STATE.modalExId = null; render(); }
  else if (action==="swap-ex"){
    const {ctx, old:oldId, new:newId} = btn.dataset;
    if (ctx==="program"){
      const days = STATE.program.days.map(d => d.type!=="muscu" ? d : {...d, exercises:d.exercises.map(e=>e===oldId?newId:e)});
      STATE.program = {...STATE.program, days};
      save(LS.program, STATE.program);
      STATE.modalExId = null;
    } else if (ctx==="session" && STATE.activeDay){
      const idx = STATE.activeDay.exercises.indexOf(oldId);
      if (idx>-1){
        captureCurrentStepInputs();
        STATE.activeDay = {...STATE.activeDay, exercises: STATE.activeDay.exercises.map((e,i)=> i===idx ? newId : e)};
        if (!STATE.guidedSets[newId]) STATE.guidedSets[newId] = [{weight:"",reps:""},{weight:"",reps:""},{weight:"",reps:""}];
        saveActiveSession();
      }
    }
    render();
  }
  else if (action==="toggle-exercise-picker"){ STATE.exercisePickerOpen = !STATE.exercisePickerOpen; render(); }
  else if (action==="toggle-swap-panel"){ STATE.showSwapPanel = !STATE.showSwapPanel; render(); }
  else if (action==="toggle-exercise-detail"){ STATE.showExerciseDetail = !STATE.showExerciseDetail; render(); }
  else if (action==="requeue-swap"){
    const {old:oldId, new:newId} = btn.dataset;
    if (STATE.activeDay){
      const idx = STATE.activeDay.exercises.indexOf(oldId);
      if (idx>-1){
        captureCurrentStepInputs();
        const arr = [...STATE.activeDay.exercises];
        arr[idx] = newId;
        arr.push(oldId);
        STATE.activeDay = {...STATE.activeDay, exercises: arr};
        if (!STATE.guidedSets[newId]) STATE.guidedSets[newId] = [{weight:"",reps:""},{weight:"",reps:""},{weight:"",reps:""}];
        STATE.exercisePickerOpen = false;
        saveActiveSession();
      }
    }
    render();
  }
  else if (action==="add-set"){ captureCurrentStepInputs(); const exId=STATE.activeDay.exercises[STATE.guidedStep]; STATE.guidedSets[exId].push({weight:"",reps:""}); saveActiveSession(); render(); }
  else if (action==="next-step"){ captureCurrentStepInputs(); STATE.guidedStep++; STATE.exercisePickerOpen=false; STATE.showSwapPanel=false; STATE.showExerciseDetail=false; saveActiveSession(); render(); }
  else if (action==="prev-step"){ captureCurrentStepInputs(); STATE.guidedStep--; STATE.exercisePickerOpen=false; STATE.showSwapPanel=false; STATE.showExerciseDetail=false; saveActiveSession(); render(); }
  else if (action==="finish-muscu"){ finishMuscu(); }
  else if (action==="finish-cardio"){ finishCardio(); }
  else if (action==="cancel-session"){ STATE.activeDay=null; STATE.muscuJustDone=false; clearActiveSession(); render(); }
  else if (action==="dismiss-finish"){ STATE.justFinished=false; render(); }
  else if (action==="set-cardio-activity"){ captureCardioForm(); STATE.cardioForm.activity = btn.dataset.value; render(); }
  else if (action==="add-water"){
    const date = todayStr();
    const entry = STATE.daily[date] || {water:0, weight:"", sleep:"", meals:[], watchKcal:""};
    entry.water = Math.max(0, (entry.water||0) + parseInt(btn.dataset.ml,10));
    STATE.daily = {...STATE.daily, [date]: entry};
    save(LS.daily, STATE.daily);
    render();
  }
  else if (action==="add-water-custom"){
    saveWeightSleepFromDOM();
    const inp = document.getElementById("water-custom");
    const ml = inp ? parseInt(inp.value,10) : NaN;
    if (!ml || isNaN(ml)) return;
    const date = todayStr();
    const entry = STATE.daily[date] || {water:0, weight:"", sleep:"", meals:[], watchKcal:""};
    entry.water = Math.max(0, (entry.water||0) + ml);
    STATE.daily = {...STATE.daily, [date]: entry};
    save(LS.daily, STATE.daily);
    render();
  }
  else if (action==="save-field"){ saveWeightSleepFromDOM(); render(); }
  else if (action==="set-profile-sex"){
    const ageEl = document.getElementById("profile-age"), heightEl = document.getElementById("profile-height");
    STATE.profile = {...STATE.profile, age: ageEl?ageEl.value:STATE.profile.age, heightCm: heightEl?heightEl.value:STATE.profile.heightCm, sex: btn.dataset.value};
    save(LS.profile, STATE.profile);
    render();
  }
  else if (action==="save-profile"){
    const ageEl = document.getElementById("profile-age"), heightEl = document.getElementById("profile-height");
    STATE.profile = {...STATE.profile, age: ageEl?ageEl.value:"", heightCm: heightEl?heightEl.value:""};
    save(LS.profile, STATE.profile);
    render();
  }
  else if (action==="toggle-meals-detail"){ saveWeightSleepFromDOM(); STATE.showMealsList = !STATE.showMealsList; render(); }
  else if (action==="set-meal-tag"){ saveWeightSleepFromDOM(); STATE.mealTag = STATE.mealTag===btn.dataset.value ? null : btn.dataset.value; render(); }
  else if (action==="search-food"){
    saveWeightSleepFromDOM();
    const inp = document.getElementById("food-search");
    STATE.foodQuery = inp ? inp.value : "";
    STATE.foodMatches = searchFood(STATE.foodQuery);
    render();
  }
  else if (action==="add-food-match"){
    const item = allFoods().find(f=>f.id===btn.dataset.id);
    if (!item) return;
    const date = todayStr();
    const entry = STATE.daily[date] || {water:0, weight:"", sleep:"", meals:[], watchKcal:""};
    const text = STATE.mealTag ? `${STATE.mealTag} : ${item.name} (${item.portion})` : `${item.name} (${item.portion})`;
    entry.meals = [...(entry.meals||[]), {text, kcal:item.kcal}];
    STATE.daily = {...STATE.daily, [date]: entry};
    save(LS.daily, STATE.daily);
    bumpFoodUsage(item.id);
    STATE.mealTag = null; STATE.foodQuery = ""; STATE.foodMatches = [];
    render();
  }
  else if (action==="add-custom-food"){
    const n = document.getElementById("custom-food-name"), k = document.getElementById("custom-food-kcal");
    const name = n ? n.value.trim() : "", kcal = k ? parseInt(k.value,10) : NaN;
    if (!name || isNaN(kcal) || kcal<=0) return;
    const id = "custom-"+Date.now();
    const food = {id, name, kcal, portion:"portion perso", alias:[normalizeText(name)]};
    STATE.customFoods = [...STATE.customFoods, food];
    save(LS.customFoods, STATE.customFoods);
    STATE.showCustomFoodForm = false;
    STATE.foodQuery = ""; STATE.foodMatches = [];
    render();
  }
  else if (action==="toggle-tier-info"){ STATE.showTierInfo = !STATE.showTierInfo; render(); }
  else if (action==="toggle-five"){
    const d = btn.dataset.date;
    const next = {...STATE.fiveDays};
    if (next[d]){ delete next[d]; STATE.fiveDays = next; save(LS.fiveDays, STATE.fiveDays); undoFiveMove(d); }
    else { next[d] = true; STATE.fiveDays = next; save(LS.fiveDays, STATE.fiveDays); autoMoveForFive(d); }
    render();
  }
  else if (action==="toggle-custom-food-form"){ STATE.showCustomFoodForm = !STATE.showCustomFoodForm; render(); }
  else if (action==="repeat-yesterday"){
    const date = todayStr();
    const yDate = addDays(date, -1);
    const yEntry = STATE.daily[yDate];
    if (!yEntry || !yEntry.meals || !yEntry.meals.length){ alert("Rien loggé hier à répéter."); return; }
    if (!confirm(`Ajouter les ${yEntry.meals.length} repas d'hier à aujourd'hui ?`)) return;
    const entry = STATE.daily[date] || {water:0, weight:"", sleep:"", meals:[], watchKcal:""};
    entry.meals = [...(entry.meals||[]), ...yEntry.meals];
    STATE.daily = {...STATE.daily, [date]: entry};
    save(LS.daily, STATE.daily);
    render();
  }
  else if (action==="add-meal"){
    saveWeightSleepFromDOM();
    const input = document.getElementById("input-meal");
    const kcalInput = document.getElementById("input-meal-kcal");
    const text = input ? input.value.trim() : "";
    if (!text) return;
    const kcalNum = kcalInput ? toNum(kcalInput.value) : NaN;
    const kcal = !isNaN(kcalNum) && kcalNum > 0 ? Math.round(kcalNum) : null;
    const date = todayStr();
    const entry = STATE.daily[date] || {water:0, weight:"", sleep:"", meals:[], watchKcal:""};
    const full = STATE.mealTag ? `${STATE.mealTag} : ${text}` : text;
    entry.meals = [...(entry.meals||[]), {text:full, kcal}];
    STATE.daily = {...STATE.daily, [date]: entry};
    save(LS.daily, STATE.daily);
    STATE.mealTag = null;
    render();
  }
  else if (action==="remove-meal"){
    saveWeightSleepFromDOM();
    const date = todayStr();
    const entry = STATE.daily[date];
    if (entry){ entry.meals = entry.meals.filter((_,i)=>i!==parseInt(btn.dataset.idx,10)); STATE.daily={...STATE.daily,[date]:entry}; save(LS.daily, STATE.daily); }
    render();
  }
  else if (action==="copy-session"){ copySessionSummary(btn.dataset.id); }
  else if (action==="export-data"){ exportData(); }
  else if (action==="reset-all"){ resetAllData(); }
  else if (action==="trigger-import"){ const inp = document.getElementById("import-file-input"); if (inp) inp.click(); }
});

// save weight/sleep on blur so typing doesn't get lost without needing a save button
document.addEventListener("blur", (e)=>{
  if (e.target && (e.target.id==="input-weight" || e.target.id==="input-sleep" || e.target.id==="input-watch-kcal")) saveWeightSleepFromDOM();
}, true);

document.addEventListener("input", (e)=>{
  if (e.target && e.target.id==="food-search"){
    const val = e.target.value;
    const pos = e.target.selectionStart;
    STATE.foodQuery = val;
    STATE.foodMatches = searchFood(val);
    render();
    const el = document.getElementById("food-search");
    if (el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(err){} }
  }
  else if (e.target && STATE.activeDay && /^(set-w-|set-r-)\d+$/.test(e.target.id)){
    captureCurrentStepInputs();
    saveActiveSession();
  }
  else if (e.target && STATE.activeDay && ["cardio-duration","cardio-calories","cardio-hr"].includes(e.target.id)){
    captureCardioForm();
    saveActiveSession();
  }
  else if (e.target && ["input-weight","input-sleep","input-watch-kcal"].includes(e.target.id)){
    saveWeightSleepFromDOM();
  }
});

document.addEventListener("keydown", (e)=>{
  if (e.key!=="Enter") return;
  if (e.target.id==="input-meal"){ e.preventDefault(); document.querySelector('[data-action="add-meal"]').click(); }
  else if (e.target.id==="food-search"){ e.preventDefault(); document.querySelector('[data-action="search-food"]').click(); }
  else if (e.target.id==="water-custom"){ e.preventDefault(); document.querySelector('[data-action="add-water-custom"]').click(); }
});

document.addEventListener("change", (e)=>{
  if (e.target && e.target.id==="import-file-input" && e.target.files && e.target.files[0]){
    importDataFromFile(e.target.files[0]);
  }
});

restoreActiveSession();
render();
</script>
</body>
</html>
